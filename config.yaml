# Token Space Splat — pipeline config.
# Every knob the pipeline reads lives here. Keep the code model-agnostic:
# no hard-coded 768 / 12 / 50257 outside this file and the model config.

model:
  # Hugging Face model id. Swap to Pythia-160m or SmolLM2-135M by changing here.
  id: openai-community/gpt2
  # Number of transformer layers. GPT-2 small = 12, giving 13 residual snapshots.
  num_layers: 12
  # Hidden size — set explicitly so we validate at load time.
  hidden_size: 768
  # Vocabulary size (splat count).
  vocab_size: 50257

corpus:
  # Primary source; falls back to WikiText-103 if unavailable.
  primary: openwebtext
  fallback: wikitext-103-raw-v1
  # Token budgets: GPU vs CPU defaults per spec.
  tokens_gpu: 20_000_000
  tokens_cpu: 5_000_000
  # Sequence length. All sequences prefixed with <|endoftext|>.
  seq_len: 512
  # Position 0 is excluded from every statistic (spec: massive-activation risk).
  exclude_first_token: true

standardise:
  # Per-dim clip after mean/std normalisation.
  clip: 6.0

pca:
  # Total components kept (3 for position + 3 base colour + 45 SH bands 1-3).
  n_components: 51
  # Randomised SVD parameters.
  random_state: 0
  n_oversamples: 20
  # Fallback trigger: if any layer's top-3 explain < ratio * (per-layer PCA top-3), fall back.
  per_layer_fallback_ratio: 0.5

covariance:
  # Floor as fraction of scene radius (isotropic).
  floor_frac: 0.004
  # Tokens with fewer than this many occurrences are flagged `sparse` and use floor.
  sparse_threshold: 20

opacity:
  # Mapped to [min, max]. Source is `neighbour_density` (mean cosine to top-20
  # neighbours). min stays high enough that every splat is visible, max = 1.0
  # so tightly-embedded tokens (glitch cluster, weekdays, digits) glow at full
  # brightness. `contrast_gamma` is applied to the [0..1] rank before the
  # remap: values > 1 push middle tokens dimmer, so the bright cluster stands
  # out more.
  min: 0.30
  max: 1.00
  contrast_gamma: 1.6

colour:
  # OKLab lightness range for base colour.
  lightness_min: 0.55
  lightness_max: 0.85
  # SH band gains (band 1, 2, 3). Reduced by clip-check if needed.
  # Bumped up from spec's [0.35, 0.20, 0.10] — with the static PC-13..57
  # encoding, the raw magnitudes are small and the shimmer needs headroom.
  band_gains: [1.2, 0.8, 0.5]
  # Clip check: sample this many view directions per splat; require fewer than
  # `clip_fail_frac` clip outside sRGB gamut.
  clip_check_views: 64
  clip_fail_frac: 0.02

export:
  # Which keyframes carry SH bands 1-3 (spec: 0, 3, 6, 9, 12). Site interpolates.
  sh_keyframes: [0, 3, 6, 9, 12]
  # Global-scale target: 99th-percentile radius over all keyframes = 1.
  scale_percentile: 99
  # Output directory (relative to repo root).
  out_dir: web/public/assets

onnx:
  # Whether to export int8-quantised ONNX for live sentence mode.
  export: true
  quantise: int8
  opset: 18   # dynamo exporter emits opset-18 Split; ORT 1.30 supports it

seed: 0
